name: CI

on:
  pull_request:
  workflow_call:

# Superseded PR runs are cancelled; runs called from Deploy are left alone.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-build:
    name: Lint & build
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts throws without it; `prisma generate` and the builds never connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - uses: nrwl/nx-set-shas@v4
      - run: bun nx affected -t lint build --parallel=3

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Not blocking yet: 17 specs already fail on main (10 web-admin, 7 web-dashboard).
    # Remove this once they pass, so a red test stops a deploy.
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - uses: nrwl/nx-set-shas@v4
      - run: bun nx affected -t test --parallel=3
