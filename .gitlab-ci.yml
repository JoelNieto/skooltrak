image: oven/bun:1.2
variables:
  CI: 'true'

stages:
  - test
  - deploy

# Main CI job - lint, test, build
CI:
  stage: test
  interruptible: true
  only:
    - main
    - merge_requests
  script:
    # This enables task distribution via Nx Cloud
    # Run this command as early as possible, before dependencies are installed
    # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#bunx-nxcloud-startcirun
    # Uncomment this line to enable task distribution
    # - bunx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

    - bun install --no-cache
    - bun playwright install --with-deps

    # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
    # - bun nx-cloud record -- echo Hello World
    # When you enable task distribution, run the e2e-ci task instead of e2e
    - bun nx run-many -t lint test build e2e
    # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci

  after_script:
    - bun nx fix-ci

# Deploy to Railway (runs only on main when RAILWAY_TOKEN is set)
# Configure RAILWAY_TOKEN in GitLab CI/CD variables for deployment
# Each Railway service should have Root Directory = / and RAILWAY_DOCKERFILE_PATH set:
#   - dashboard-backend: apps/dashboard-backend/Dockerfile
#   - admin-backend: apps/admin-backend/Dockerfile
#   - web-dashboard: apps/web-dashboard/Dockerfile
#   - web-admin: apps/web-admin/Dockerfile
# Alternative: Connect the repo via Railway dashboard for automatic deploys on push
deploy:
  stage: deploy
  only:
    - main
  when: manual
  script:
    - curl -fsSL https://railway.app/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - railway up --detach
