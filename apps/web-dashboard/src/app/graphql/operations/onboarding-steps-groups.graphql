query OnboardingStepsGroupsGetSchools {
  schools {
    id
  }
}

query OnboardingStepsGroupsStudyPlansBySchoolId($schoolId: String!) {
  studyPlansBySchoolId(schoolId: $schoolId) {
    id
    name
  }
}

mutation OnboardingStepsCreateClassGroup($createClassGroupInput: CreateClassGroupInput!) {
  createClassGroup(createClassGroupInput: $createClassGroupInput) {
    id
    name
  }
}
