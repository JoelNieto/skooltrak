# Production stack: one Docker host, Caddy in front, managed Postgres (Neon) outside.
# The deploy workflow copies this file and the Caddyfile to the server, writes the commit SHA
# to IMAGE_TAG in .env, and runs `docker compose up -d`. There is no `latest`: what runs is
# always the SHA pinned in .env.
# Secrets live only in .env next to this file on the server (see .env.example).

# Frontends override env_file with [], so the backend secrets never reach them.
x-app: &app
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-dashboard:
        condition: service_healthy
      web-admin:
        condition: service_healthy

  dashboard-backend:
    <<: *app
    image: ${REGISTRY:-ghcr.io/joelnieto}/skooltrak-dashboard-backend:${IMAGE_TAG:?IMAGE_TAG is written to .env by the deploy workflow}
    environment:
      PORT: 3000
      APP_URL: https://${APP_DOMAIN}
      BETTER_AUTH_URL: https://${APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN}
      TRUSTED_ORIGINS: https://${APP_DOMAIN}

  admin-backend:
    <<: *app
    image: ${REGISTRY:-ghcr.io/joelnieto}/skooltrak-admin-backend:${IMAGE_TAG:?IMAGE_TAG is written to .env by the deploy workflow}
    environment:
      PORT: 5050
      APP_URL: https://${ADMIN_DOMAIN}
      BETTER_AUTH_URL: https://${ADMIN_DOMAIN}
      CORS_ORIGINS: https://${ADMIN_DOMAIN}
      TRUSTED_ORIGINS: https://${ADMIN_DOMAIN}

  web-dashboard:
    <<: *app
    image: ${REGISTRY:-ghcr.io/joelnieto}/skooltrak-web-dashboard:${IMAGE_TAG:?IMAGE_TAG is written to .env by the deploy workflow}
    env_file: []
    environment:
      PORT: 4200
      # localhost: the image's HEALTHCHECK calls http://localhost:4200/. Without it, every check
      # logs "ERROR: Bad Request" twice a minute. Caddy always forwards the public Host, so
      # outside requests can't present localhost.
      NG_ALLOWED_HOSTS: ${APP_DOMAIN},localhost
      NG_TRUST_PROXY_HEADERS: x-forwarded-proto,x-forwarded-host
    depends_on:
      dashboard-backend:
        condition: service_healthy

  web-admin:
    <<: *app
    image: ${REGISTRY:-ghcr.io/joelnieto}/skooltrak-web-admin:${IMAGE_TAG:?IMAGE_TAG is written to .env by the deploy workflow}
    env_file: []
    environment:
      PORT: 4300
      NG_ALLOWED_HOSTS: ${ADMIN_DOMAIN},localhost # localhost: see web-dashboard
      NG_TRUST_PROXY_HEADERS: x-forwarded-proto,x-forwarded-host
    depends_on:
      admin-backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
