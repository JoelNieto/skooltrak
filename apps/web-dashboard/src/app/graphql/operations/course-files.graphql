query FilesForCourse($courseId: String!, $take: Int!, $skip: Int!, $search: String) {
  filesForCourse(
    courseId: $courseId
    take: $take
    skip: $skip
    search: $search
  ) {
    id
    name
    mimeType
    size
    access
    updatedAt
  }
}

mutation CreateFileDownloadUrl($createFileDownloadInput: CreateFileDownloadInput!) {
  createFileDownloadUrl(createFileDownloadInput: $createFileDownloadInput) {
    downloadUrl
  }
}
