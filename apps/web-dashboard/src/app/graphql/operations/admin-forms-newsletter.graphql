query NewsletterFormGetNewsletter($id: String!) {
  newsletter(id: $id) {
    id
    title
    content
    published
  }
}

mutation NewsletterFormUpdateNewsletter($updateNewsletterInput: UpdateNewsletterInput!) {
  updateNewsletter(updateNewsletterInput: $updateNewsletterInput) {
    id
  }
}

mutation NewsletterFormCreateNewsletter($createNewsletterInput: CreateNewsletterInput!) {
  createNewsletter(createNewsletterInput: $createNewsletterInput) {
    id
  }
}
