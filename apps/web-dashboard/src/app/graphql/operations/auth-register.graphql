query RegisterValidateEmailToken($token: String!, $email: String!) {
  validateEmailToken(token: $token, email: $email)
}

query RegisterCheckPendingInvitation($email: String!) {
  checkPendingInvitation(email: $email) {
    hasPendingInvitation
    role
    organizationName
  }
}

mutation RegisterSendVerificationLink($email: String!) {
  sendVerificationLink(email: $email)
}

mutation RegisterCreateInvitationAccessLink($email: String!) {
  createInvitationAccessLink(email: $email) {
    url
  }
}

mutation RegisterSignUp($input: SignUpInput!) {
  signUp(input: $input) {
    accessToken
  }
}
