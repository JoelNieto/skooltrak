query GradeBucketsByCourseId($courseId: String!) {
  gradeBucketsByCourseId(courseId: $courseId) {
    id
    name
    weight
  }
}

mutation CreateGrade($createGradeInput: CreateGradeInput!) {
  createGrade(createGradeInput: $createGradeInput) {
    id
    title
    comments
    bucketId
    published
    date
  }
}
