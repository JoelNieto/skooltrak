query GetCourses($schoolId: String!, $take: Int!, $skip: Int!, $search: String) {
  count: coursesCount(schoolId: $schoolId, search: $search)
  courses(schoolId: $schoolId, take: $take, skip: $skip, search: $search) {
    id
    name
    shortName
    schoolId
    subject {
      name
    }
    studyPlan {
      name
    }
    teacher {
      id
      name
    }
    subjectId
    studyPlanId
    teacherId
    code
    createdAt
    updatedAt
  }
}
