query GetClassGroups($schoolId: String!, $take: Int!, $skip: Int!) {
  count: classGroupsCount(schoolId: $schoolId)
  classGroups(schoolId: $schoolId, take: $take, skip: $skip) {
    id
    name
    createdAt
    updatedAt
    teacherId
    studyPlanId
    teacher {
      id
      name
    }
    studyPlan {
      id
      name
    }
  }
}
