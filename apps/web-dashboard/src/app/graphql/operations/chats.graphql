query ChatsMyChats {
  myChats {
    id
    name
    type
    courseId
    assignmentId
    classGroupId
    createdAt
    updatedAt
    participants {
      id
      userId
      role
      user {
        id
        firstName
        lastName
        initials
        color
        role {
          name
        }
        student {
          id
          classGroup {
            id
            name
          }
        }
      }
    }
    createdBy {
      id
      firstName
      lastName
      initials
    }
  }
}

query ChatsChat($id: String!) {
  chat(id: $id) {
    id
    name
    type
    courseId
    assignmentId
    classGroupId
    createdAt
    updatedAt
    participants {
      id
      userId
      role
      user {
        id
        firstName
        lastName
        initials
        color
        role {
          name
        }
        student {
          id
          classGroup {
            id
            name
          }
        }
      }
    }
    createdBy {
      id
      firstName
      lastName
      initials
    }
  }
}

query ChatsChatMessages($input: ChatMessagesInput!) {
  chatMessages(input: $input) {
    id
    chatId
    senderId
    content
    createdAt
    sender {
      id
      firstName
      lastName
      initials
      color
      role {
        name
      }
      student {
        id
        classGroup {
          id
          name
        }
      }
    }
  }
}

mutation ChatsCreateDirectChat($recipientId: String!) {
  createDirectChat(recipientId: $recipientId) {
    id
    name
    type
    participants {
      id
      user {
        id
        firstName
        lastName
        initials
      }
    }
  }
}

mutation ChatsCreateGroupChat($input: CreateGroupChatInput!) {
  createGroupChat(input: $input) {
    id
    name
    type
    participants {
      id
      user {
        id
        firstName
        lastName
        initials
      }
    }
  }
}

mutation ChatsCreateContextualChat($input: CreateContextualChatInput!) {
  createContextualChat(input: $input) {
    id
    name
    type
    courseId
    assignmentId
    classGroupId
    participants {
      id
      user {
        id
        firstName
        lastName
        initials
      }
    }
  }
}

mutation ChatsSendMessage($input: SendMessageInput!) {
  sendMessage(input: $input) {
    id
    chatId
    senderId
    content
    createdAt
    sender {
      id
      firstName
      lastName
      initials
      color
    }
  }
}

mutation ChatsMarkChatRead($chatId: String!) {
  markChatRead(chatId: $chatId) {
    id
    lastReadAt
  }
}

query ChatsUnreadCount {
  chatUnreadCount
}

subscription ChatsMessageReceived($chatId: String) {
  messageReceived(chatId: $chatId) {
    id
    chatId
    senderId
    content
    createdAt
    sender {
      id
      firstName
      lastName
      initials
      color
      role {
        name
      }
      student {
        id
        classGroup {
          id
          name
        }
      }
    }
  }
}
