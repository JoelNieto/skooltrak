query Course($id: String!) {
  course(id: $id) {
    id
    name
    shortName
    code
    createdAt
    updatedAt
    subject {
      id
      name
    }
    teacher {
      id
      name
      color
      initials
      user {
        id
      }
    }
    studyPlan {
      id
      name
      gradeMetric {
        id
        name
        minimumApproval
        minimumExcellence
        maximum
        minimum
        createdAt
        updatedAt
      }
    }
  }
}
