query AdminDegreesBySchoolId($schoolId: String!, $take: Int!, $skip: Int!) {
  count: degreesBySchoolIdCount(schoolId: $schoolId)
  degreesBySchoolId(schoolId: $schoolId, take: $take, skip: $skip) {
    id
    name
    shortName
    schoolId
    school {
      id
      name
    }
    createdAt
    updatedAt
  }
}

mutation AdminRemoveDegree($removeDegreeId: String!) {
  removeDegree(id: $removeDegreeId) {
    id
  }
}
