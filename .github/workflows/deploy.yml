name: Deploy

# Every push to main: CI → build and push the four images → migrate the database → roll out.
# Also runnable by hand (Actions → Deploy → Run workflow), e.g. to redeploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/joelnieto
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.app }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [dashboard-backend, admin-backend, web-dashboard, web-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # SHA only, no `latest`: images are pushed before migrations run, so a moving tag
          # could point at code the database isn't ready for. The server pins the SHA in .env.
          tags: ${{ env.REGISTRY }}/skooltrak-${{ matrix.app }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  migrate:
    name: Migrate database
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      # Neon DIRECT (non-pooled) connection string: migrations need a session, not PgBouncer.
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy
      - run: bunx prisma generate
      # Idempotent: adds permissions and default roles that a release introduced.
      - run: bun run db:add-roles-permissions

  deploy:
    name: Roll out
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy stack files
        run: scp deploy/compose.yml deploy/Caddyfile "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/skooltrak/"
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        # The script goes over stdin, so the registry token never appears in a process list.
        # Unquoted heredoc: ${VARS} expand here on the runner; \$ is left for the server.
        run: |
          ssh "$TARGET" bash -se <<EOF
          set -euo pipefail
          cd ~/skooltrak

          # .env is the one record of what runs, so a later manual \`docker compose up -d\`
          # (e.g. after changing a secret) keeps this version instead of drifting.
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' .env
          else
            echo 'IMAGE_TAG=${IMAGE_TAG}' >> .env
          fi

          echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GH_ACTOR}' --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose pull --quiet
          docker compose up -d --remove-orphans --wait --wait-timeout 180

          # Compose doesn't recreate Caddy when only the Caddyfile changed, and Caddy doesn't
          # watch it, so apply the copy made above explicitly.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

          # Keep the 5 newest images per app as rollback targets; the running one is never removed.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '/skooltrak-' \
            | awk -F: '{ if (++n[\$1] > 5) print }' \
            | xargs -r docker rmi >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          EOF
