query AdminGetSubjects(
  $take: Int!
  $skip: Int!
  $search: String
  $orderBy: String
  $orderDirection: String
) {
  count: findManySubjectsCount(search: $search)
  subjects(
    take: $take
    skip: $skip
    search: $search
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    name
    code
    createdAt
    updatedAt
  }
}

mutation AdminRemoveSubject($removeSubjectId: String!) {
  removeSubject(id: $removeSubjectId) {
    id
  }
}
