query OnboardingStepsGetSchools {
  schools {
    id
  }
}

query OnboardingStepsStudyPlansBySchoolId($schoolId: String!) {
  studyPlansBySchoolId(schoolId: $schoolId) {
    id
    name
  }
}

query OnboardingStepsGetSubjects($take: Int!, $orderBy: String) {
  subjects(take: $take, orderBy: $orderBy) {
    id
    name
  }
}

mutation OnboardingStepsCreateCourse($createCourseInput: CreateCourseInput!) {
  createCourse(createCourseInput: $createCourseInput) {
    id
    name
  }
}
