name: Deploy

# Every push to main: CI → build and push the four images → migrate the database → roll out.
# Also runnable by hand (Actions → Deploy → Run workflow), e.g. to redeploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/joelnieto
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.app }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [dashboard-backend, admin-backend, web-dashboard, web-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/skooltrak-${{ matrix.app }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/skooltrak-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  migrate:
    name: Migrate database
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      # Neon DIRECT (non-pooled) connection string: migrations need a session, not PgBouncer.
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy
      - run: bunx prisma generate
      # Idempotent: adds permissions and default roles that a release introduced.
      - run: bun run db:add-roles-permissions

  deploy:
    name: Roll out
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy stack files
        run: scp deploy/compose.yml deploy/Caddyfile "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/skooltrak/"
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ~/skooltrak \
              && echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
              && export IMAGE_TAG='${{ env.IMAGE_TAG }}' \
              && docker compose pull \
              && docker compose up -d --remove-orphans --wait --wait-timeout 180 \
              && docker logout ghcr.io \
              && docker image prune -f"
