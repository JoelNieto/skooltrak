query GetSchools {
  schools {
    id
    name
    slug
    organizationId
    shortName
    logo
    logoUrl
    address
    city
    state
    zip
    country
    email
    phone
    currencyCode
    currentYear
    website
    primaryColor
    secondaryColor
    tertiaryColor
    createdAt
    updatedAt
  }
}

query UnreadMessagesCount {
  unreadMessagesCount
}
