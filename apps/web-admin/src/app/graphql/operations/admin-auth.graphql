query WebAdminAuthMe {
  me {
    id
    email
    firstName
    lastName
    color
    teacher {
      id
      firstName
      fatherName
    }
    student {
      id
      firstName
      fatherName
    }
    role {
      name
      permissions {
        id
        descriptiveId
        description
      }
    }
  }
}

mutation WebAdminAuthLogin($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    accessToken
  }
}
